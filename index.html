<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="الموقع التعريفي الرسمي لتطبيق DEDA – الدليل الدقيق.">
  <title>DEDA – الدليل الدقيق</title>
  <style>
    :root {color-scheme: light; font-family: system-ui, -apple-system, sans-serif;}
    * {box-sizing: border-box}
    body {margin:0;min-height:100vh;display:grid;place-items:center;background:#f8faf2;color:#143d33;padding:24px}
    main {width:100%;max-width:560px;text-align:center;background:white;border:1px solid #e0e9e0;border-radius:24px;padding:42px 24px;box-shadow:0 12px 30px #123f3011}
    .logo {width:76px;height:76px;margin:0 auto 20px;display:grid;place-items:center;border-radius:20px;color:#fff;background:linear-gradient(145deg,#065c48,#12442f);font-size:38px;font-weight:850;direction:ltr}
    h1 {font-size:clamp(27px,5vw,36px);margin:0 0 10px}
    p {font-size:17px;line-height:1.8;margin:0 0 24px;color:#41564d}
    a {display:inline-block;background:#0a644d;padding:13px 24px;border-radius:12px;text-decoration:none;color:white;font-weight:700}
    a:focus-visible {outline:3px solid #c09b32;outline-offset:3px}
    footer {margin-top:28px;font-size:13px;color:#677a71}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">D</div>
    <h1>DEDA – الدليل الدقيق</h1>
    <p>اكتشف الأماكن والخدمات واستفد من الخرائط والملاحة داخل العراق.</p>
    <a href="https://play.google.com/store/apps/details?id=com.diraq.ludo.d_iraq_ludo" rel="noopener noreferrer">تحميل التطبيق من Google Play</a>
    <footer>الموقع التعريفي لتطبيق DEDA</footer>
  </main>
</body>
</html>
